name: build

on:
  push:
    branches:
      - "main"
      - "claude/**"
  pull_request:
    branches:
      - "main"
  workflow_dispatch: {}

jobs:
  assemble-debug:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install NDK 26.3.11579264
        run: |
          echo "y" | sdkmanager --install "ndk;26.3.11579264" > /dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Whisper model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/ggml-base-q5_1.bin
          key: whisper-ggml-base-q5_1-v1

      - name: Download Whisper model
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/assets/models
          curl -sSL --fail --retry 3 -o app/src/main/assets/models/ggml-base-q5_1.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin"

      - name: Verify Whisper model
        run: |
          test -s app/src/main/assets/models/ggml-base-q5_1.bin
          ls -la app/src/main/assets/models/ggml-base-q5_1.bin
          sha256sum app/src/main/assets/models/ggml-base-q5_1.bin

      - name: assembleDebug
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
