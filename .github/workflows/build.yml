name: build

on:
  push:
    branches:
      - "main"
      - "claude/**"
  pull_request:
    branches:
      - "main"
  workflow_dispatch: {}

jobs:
  assemble-debug:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install NDK 26.3.11579264
        run: |
          echo "y" | sdkmanager --install "ndk;26.3.11579264" > /dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Whisper model
        id: cache-whisper
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/ggml-base-q5_1.bin
          key: whisper-ggml-base-q5_1-v1

      - name: Download Whisper model
        if: steps.cache-whisper.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/assets/models
          curl -sSL --fail --retry 3 -o app/src/main/assets/models/ggml-base-q5_1.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin"

      - name: Cache Qwen3 LLM model
        id: cache-llm
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/qwen3-0.6b-instruct-q4_k_m.gguf
          key: qwen3-0.6b-instruct-q4-k-m-v1

      - name: Download Qwen3 LLM model
        if: steps.cache-llm.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/assets/models
          out=app/src/main/assets/models/qwen3-0.6b-instruct-q4_k_m.gguf
          # Los repos GGUF de Qwen3 los publican varios mirrors. Probamos
          # en orden y nos quedamos con el primero que responda 200.
          urls=(
            "https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf"
            "https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf"
            "https://huggingface.co/bartowski/Qwen_Qwen3-0.6B-GGUF/resolve/main/Qwen_Qwen3-0.6B-Q4_K_M.gguf"
            "https://huggingface.co/bartowski/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf"
            "https://huggingface.co/lmstudio-community/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf"
          )
          for u in "${urls[@]}"; do
            echo "Probando $u"
            code=$(curl -sIL -o /dev/null -w "%{http_code}" "$u" || true)
            echo "  → HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Descargando de $u"
              curl -sSL --fail --retry 3 -o "$out" "$u"
              break
            fi
          done
          test -s "$out" || { echo "❌ Ningun mirror de Qwen3 respondio 200"; exit 1; }

      - name: Verify models
        run: |
          test -s app/src/main/assets/models/ggml-base-q5_1.bin
          test -s app/src/main/assets/models/qwen3-0.6b-instruct-q4_k_m.gguf
          ls -la app/src/main/assets/models/
          sha256sum app/src/main/assets/models/*.bin app/src/main/assets/models/*.gguf

      - name: assembleDebug
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
